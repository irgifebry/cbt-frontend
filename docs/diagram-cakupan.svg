      #diagram-cakupan-root { --color-paper: #f5f5f5;
      --color-paper-2: #e8eeea;
      --color-ink: #1e293b;
      --color-muted: #4f5d75;
      --color-soft: #5a6580;
      --color-accent: #167a61;
      --color-link: #2e5aa8;
      --color-rule: rgba(30, 41, 59, 0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #diagram-cakupan-root { font-family: var(--font-sans); color: var(--color-ink); }
      #diagram-cakupan-root .subtitle { font-size: 0.82rem; color: var(--color-muted); margin-bottom: 1.5rem; }
      #diagram-cakupan-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#diagram-cakupan-root .diagram-container { overflow-x: visible; }
}</style>
