<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cbt-cakupan-title cbt-cakupan-desc" id="diagram-cakupan-root">
        <title id="cbt-cakupan-title">Cakupan Seluruh CBT U-Cademy</title>
        <desc id="cbt-cakupan-desc">Peta arsitektur yang memisahkan cakupan skripsi CBT mandiri dari LMS yang ada, menandai fondasi API dan UI demo, serta showing endpoint bisnis dan keputusan Q01 sampai Q12 yang masih menunggu dosen pembimbing.</desc>
